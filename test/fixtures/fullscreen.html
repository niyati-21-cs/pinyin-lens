<!doctype html><meta charset="utf-8"><title>Fullscreen test</title>
<body style="margin:0;background:#111">
<button id="fs" style="position:absolute;top:0;left:0;z-index:5">fullscreen</button>
<div id="player" style="width:960px;margin:30px auto;background:#000">
  <video id="v" src="clip.webm" muted loop playsinline style="width:100%;height:100%;display:block">
    <track kind="subtitles" srclang="zh-CN" label="Chinese" src="zh.vtt" default>
  </video>
</div>
<script>document.getElementById('fs').onclick = () => document.getElementById('player').requestFullscreen();</script>
</body>
