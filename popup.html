<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pinyin Lens</title>
<link rel="stylesheet" href="pages.css">
<style>
  body { width: 330px; padding: 12px; background: var(--field); }
  .card { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .card h2 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .head { display: flex; align-items: center; gap: 10px; }
  .head img { width: 30px; height: 30px; border-radius: 8px; }
  .head h1 { flex: 1; font-size: 16px; margin: 0; line-height: 1.2; }
  .head h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }

  /* on/off switches: real checkboxes, drawn as a track and knob */
  .switch { appearance: none; flex: none; position: relative; width: 34px; height: 20px; margin: 0;
    border-radius: 999px; background: var(--line); cursor: pointer; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(14px); }
  .switch:disabled { opacity: .5; cursor: default; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
  .opt > span { flex: 1; }
  .opt small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.35; }

  /* what each word shows: three checkbox chips */
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .chip { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px;
    border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; user-select: none; }
  .chip input { position: absolute; top: 6px; right: 6px; width: 14px; height: 14px; margin: 0; accent-color: var(--accent); }
  .chip b { font-size: 18px; line-height: 1.2; font-weight: 600; }
  .chip span { font-size: 11.5px; color: var(--muted); }
  .chip:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  .preview { margin-top: 10px; padding: 10px; border-radius: 10px; background: #111; color: #fff;
    display: flex; justify-content: center; gap: 8px; font-size: 26px; min-height: 64px; align-items: flex-end; }
  .preview .w { display: inline-flex; flex-direction: column; align-items: center; }
  .preview .py { font: 500 var(--py)/1.2 system-ui, sans-serif; }
  .preview .no-hz .py { font-weight: 600; }
  .preview .hz { line-height: 1.25; font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .preview .gl { font: var(--gl)/1.2 system-ui, sans-serif; opacity: .8; }

  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg label { padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--accent); color: #fff; }
  .sub { margin: 0 0 4px 0; padding-left: 12px; border-left: 2px solid var(--line); }
  .sub input[type=text] { margin: 2px 0 6px; padding: 6px 8px; font-size: 13px; }

  details summary { cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 6px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: center; margin-top: 8px; font-size: 13px; }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .slider output { font-size: 12px; color: var(--muted); }
  #resetSizes { margin-top: 10px; padding: 5px 10px; font-size: 12.5px; }

  #status { font-size: 12px; margin: 4px 0 0; min-height: 0; }
  #status:empty { display: none; }
  .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .foot a { display: block; text-align: center; padding: 8px; border-radius: 10px; background: var(--bg);
    color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 600; }
  .foot a:hover { color: var(--accent); }
</style>

<div class="card head">
  <img src="icons/icon48.png" alt="">
  <h1>Pinyin Lens<small>Overlay on videos · Alt+P</small></h1>
  <input type="checkbox" class="switch" id="enabled" aria-label="Show overlay on videos">
</div>

<div class="card">
  <h2>Show on each word</h2>
  <div class="chips">
    <label class="chip"><input type="checkbox" id="showPinyin"><b>wǒ</b><span>Pinyin</span></label>
    <label class="chip"><input type="checkbox" id="showHanzi"><b>我</b><span>Characters</span></label>
    <label class="chip"><input type="checkbox" id="showGloss"><b>I</b><span>Meaning</span></label>
  </div>
  <div class="preview" id="preview" aria-hidden="true"></div>
</div>

<div class="card">
  <h2>Also show</h2>
  <label class="opt"><span>English subtitles line<small>When the video has them, or YouTube can make them</small></span>
    <input type="checkbox" class="switch" id="showEnglish"></label>
  <div class="sub" id="englishOptions">
    <label class="opt"><span>Pick the English track automatically</span>
      <input type="checkbox" class="switch" id="englishAuto"></label>
    <div id="englishLangField" hidden>
      <input type="text" id="englishLang" placeholder="Language code or name, e.g. en-GB or English (UK)">
    </div>
  </div>
  <div class="opt"><span>Pinyin position</span>
    <div class="seg" role="radiogroup" aria-label="Pinyin position">
      <label><input type="radio" name="overlayPosition" value="bottom">Bottom</label>
      <label><input type="radio" name="overlayPosition" value="top">Top</label>
    </div>
  </div>
</div>

<div class="card">
  <h2>No Chinese subtitles?</h2>
  <label class="opt"><span>Read subtitles from the video picture<small>For subtitles drawn into the video</small></span>
    <input type="checkbox" class="switch" id="ocrEnabled"></label>
  <label class="opt"><span>Voice recognition on this tab<small>Transcribes the audio, free and on-device</small></span>
    <input type="checkbox" class="switch" id="listen"></label>
  <p id="status" class="muted"></p>
</div>

<div class="card">
  <details id="advanced">
    <summary>Advanced: sizes</summary>
    <div class="slider"><span>Characters</span><output id="fontSizeOut"></output>
      <input type="range" id="fontSize" min="18" max="60" step="1"></div>
    <div class="slider"><span>Pinyin</span><output id="pinyinScaleOut"></output>
      <input type="range" id="pinyinScale" min="30" max="120" step="5"></div>
    <div class="slider"><span>Meaning</span><output id="glossScaleOut"></output>
      <input type="range" id="glossScale" min="30" max="120" step="5"></div>
    <div class="slider"><span>English line</span><output id="englishScaleOut"></output>
      <input type="range" id="englishScale" min="30" max="120" step="5"></div>
    <button id="resetSizes">Reset to auto</button>
  </details>
</div>

<div class="foot">
  <a href="wordlist.html" target="_blank">★ Saved words (<span id="count">0</span>)</a>
  <a href="options.html" target="_blank">⚙ Settings</a>
</div>
<script src="lib/defaults.js"></script>
<script src="popup.js"></script>
</html>
